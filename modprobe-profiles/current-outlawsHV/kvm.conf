# KVM module options for VFIO gaming VM (win11)

# Prevents BSODs when AutoLoadHV's nested hypervisor accesses unhandled MSRs
options kvm ignore_msrs=1

# halt_poll_ns: KVM spin-polls for 500us before sleeping an idle vCPU host thread.
# Without this, wakeup latency is 100-500us, causing clock interrupts to arrive late
# under gaming load -> CLOCK_WATCHDOG_TIMEOUT BSOD.
options kvm halt_poll_ns=500000

# ple_gap=0: Disables Pause Loop Exiting.
# In a fully-pinned VM, spinlock holders run on dedicated physical cores and will
# release the lock naturally; forced exits just add overhead. Removes a whole
# class of spurious VMEXITs under gaming load.
options kvm_intel ple_gap=0
