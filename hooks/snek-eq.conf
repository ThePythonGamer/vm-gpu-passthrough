# snek-EQ: PipeWire filter-chain replacement for EasyEffects preset
# Pre-amp: -10.89 dB | 10-band parametric EQ | Loudness output: +6 dB
#
# This file is NOT auto-loaded. It is symlinked into pipewire.conf.d/
# by the qemu hook on VM start, and removed on VM release.

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "snek-EQ"
            media.name        = "snek-EQ"
            filter.graph = {
                nodes = [
                    # ---- Pre-amp: -10.89 dB ----
                    {
                        type  = builtin
                        name  = preamp
                        label = bq_highshelf
                        control = { "Freq" = 0.0  "Q" = 1.0  "Gain" = -10.89 }
                    }

                    # ---- Band 0: Bell 53.7 Hz, -2.3 dB, Q=1.19 ----
                    {
                        type  = builtin
                        name  = eq_band0
                        label = bq_peaking
                        control = { "Freq" = 53.7  "Q" = 1.19  "Gain" = -2.3 }
                    }

                    # ---- Band 1: Bell 100.2 Hz, -6.1 dB, Q=0.40 ----
                    {
                        type  = builtin
                        name  = eq_band1
                        label = bq_peaking
                        control = { "Freq" = 100.2  "Q" = 0.40  "Gain" = -6.1 }
                    }

                    # ---- Band 2: Lo-shelf 105 Hz, +12.5 dB, Q=0.667 ----
                    {
                        type  = builtin
                        name  = eq_band2
                        label = bq_lowshelf
                        control = { "Freq" = 105.0  "Q" = 0.667  "Gain" = 12.5 }
                    }

                    # ---- Band 3: Bell 1549.2 Hz, +0.6 dB, Q=3.21 ----
                    {
                        type  = builtin
                        name  = eq_band3
                        label = bq_peaking
                        control = { "Freq" = 1549.2  "Q" = 3.21  "Gain" = 0.6 }
                    }

                    # ---- Band 4: Bell 1756.2 Hz, +4.3 dB, Q=1.13 ----
                    {
                        type  = builtin
                        name  = eq_band4
                        label = bq_peaking
                        control = { "Freq" = 1756.2  "Q" = 1.13  "Gain" = 4.3 }
                    }

                    # ---- Band 5: Bell 2991.3 Hz, -1.5 dB, Q=3.99 ----
                    {
                        type  = builtin
                        name  = eq_band5
                        label = bq_peaking
                        control = { "Freq" = 2991.3  "Q" = 3.99  "Gain" = -1.5 }
                    }

                    # ---- Band 6: Bell 5203 Hz, -2.4 dB, Q=2.41 ----
                    {
                        type  = builtin
                        name  = eq_band6
                        label = bq_peaking
                        control = { "Freq" = 5203.0  "Q" = 2.41  "Gain" = -2.4 }
                    }

                    # ---- Band 7: Bell 9011.9 Hz, +5.3 dB, Q=2.86 ----
                    {
                        type  = builtin
                        name  = eq_band7
                        label = bq_peaking
                        control = { "Freq" = 9011.9  "Q" = 2.86  "Gain" = 5.3 }
                    }

                    # ---- Band 8: Bell 10000 Hz, +0.9 dB, Q=3.01 ----
                    {
                        type  = builtin
                        name  = eq_band8
                        label = bq_peaking
                        control = { "Freq" = 10000.0  "Q" = 3.01  "Gain" = 0.9 }
                    }

                    # ---- Band 9: Hi-shelf 10000 Hz, +0.2 dB, Q=0.667 ----
                    {
                        type  = builtin
                        name  = eq_band9
                        label = bq_highshelf
                        control = { "Freq" = 10000.0  "Q" = 0.667  "Gain" = 0.2 }
                    }

                    # ---- Loudness output gain: +6 dB ----
                    {
                        type  = builtin
                        name  = loudness_gain
                        label = bq_highshelf
                        control = { "Freq" = 0.0  "Q" = 1.0  "Gain" = 6.0 }
                    }
                ]
                links = [
                    { output = "preamp:Out"        input = "eq_band0:In" }
                    { output = "eq_band0:Out"      input = "eq_band1:In" }
                    { output = "eq_band1:Out"      input = "eq_band2:In" }
                    { output = "eq_band2:Out"      input = "eq_band3:In" }
                    { output = "eq_band3:Out"      input = "eq_band4:In" }
                    { output = "eq_band4:Out"      input = "eq_band5:In" }
                    { output = "eq_band5:Out"      input = "eq_band6:In" }
                    { output = "eq_band6:Out"      input = "eq_band7:In" }
                    { output = "eq_band7:Out"      input = "eq_band8:In" }
                    { output = "eq_band8:Out"      input = "eq_band9:In" }
                    { output = "eq_band9:Out"      input = "loudness_gain:In" }
                ]
            }
            capture.props = {
                node.name   = "effect_input.snek_eq"
                media.class = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name         = "effect_output.snek_eq"
                node.passive      = true
                audio.channels    = 2
                audio.position    = [ FL FR ]
            }
        }
    }
]
